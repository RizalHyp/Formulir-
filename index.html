<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulir Rizal Hypno Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2466;--gold:#b8923a;--bg:#f6f4ee;--card:#fff;--ink:#1d2033;--mut:#6b6f85;--line:#e3dfd2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0b0f1e;color:#fff;text-align:center;padding:22px 16px;border-bottom:3px solid var(--gold)}
header .logos{display:flex;justify-content:center;gap:18px;align-items:center}
header img{height:76px;width:auto;border-radius:50%}
header h1{font-family:'Cormorant Garamond',serif;font-size:28px;margin:10px 0 0;letter-spacing:.5px}
header p{margin:2px 0 0;color:#cdbf94;font-size:13px;letter-spacing:2px;text-transform:uppercase}
main{max-width:760px;margin:24px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(27,36,102,.05)}
h2{font-family:'Cormorant Garamond',serif;color:var(--navy);margin:0 0 6px;font-size:26px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}label i{color:#b3261e}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cfcab8;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.opt{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}.opt input{width:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 18px;background:var(--navy);color:#fff;font-weight:600}
button.g{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.d{background:#b3261e}button.gold{background:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.badge{background:#eceefb;color:var(--navy);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.err{color:#b3261e;margin:10px 0;font-size:14px}.ok{color:#1b7a3d}
.fld{border:1px dashed #cfcab8;border-radius:8px;padding:12px;margin:10px 0}
.fld .row>*{flex:1;min-width:120px}.fld .row button{flex:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#eceefb;color:var(--navy)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}footer a{color:var(--mut)}
</style></head><body>

<script type="text/plain" id="gs">
// BACKEND FORMULIR - Rizal Hypno Center (Google Apps Script, data disimpan di Google Drive)
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'GANTI_PASSWORD_ANDA'; // <-- WAJIB diganti
const FOLDER_NAME = 'Rizal Hypno Center - Formulir';

function folder() {
  const it = DriveApp.getFoldersByName(FOLDER_NAME);
  return it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER_NAME);
}
function load(n) {
  const it = folder().getFilesByName(n);
  return it.hasNext() ? JSON.parse(it.next().getBlob().getDataAsString() || '[]') : [];
}
function save(n, d) {
  const f = folder(), it = f.getFilesByName(n), s = JSON.stringify(d);
  if (it.hasNext()) it.next().setContent(s); else f.createFile(n, s, 'application/json');
}
function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function doGet() { return out({ ok: true }); }
function photoFolder() {
  const p = folder(), it = p.getFoldersByName('Foto Identitas');
  return it.hasNext() ? it.next() : p.createFolder('Foto Identitas');
}
function trashPhotos(rs) {
  rs.forEach(r => Object.keys(r.data || {}).forEach(k => {
    const v = r.data[k];
    if (v && v.file) { try { DriveApp.getFileById(v.file).setTrashed(true); } catch (e) {} }
  }));
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const q = JSON.parse(e.postData.contents), a = q.action, c = CacheService.getScriptCache();
    const admin = () => { if (!c.get('t_' + q.token)) throw new Error('Sesi berakhir, silakan login ulang.'); };

    if (a === 'login') {
      if (q.user === ADMIN_USER && q.pass === ADMIN_PASS) {
        const t = Utilities.getUuid(); c.put('t_' + t, '1', 21600);
        return out({ ok: true, token: t });
      }
      throw new Error('Username atau password salah.');
    }
    if (a === 'logout') { c.remove('t_' + q.token); return out({ ok: true }); }

    if (a === 'getForm') { // publik
      const f = load('forms.json').find(x => x.id === q.id && x.active !== false);
      if (!f) throw new Error('Formulir tidak ditemukan atau sudah ditutup.');
      return out({ ok: true, form: f });
    }
    if (a === 'submit') { // publik
      const f = load('forms.json').find(x => x.id === q.id && x.active !== false);
      if (!f) throw new Error('Formulir tidak ditemukan atau sudah ditutup.');
      f.fields.forEach(fl => { if (fl.req && !String((q.data || {})[fl.label] || '').trim()) throw new Error('Mohon isi: ' + fl.label); });
      Object.keys(q.data || {}).forEach(k => {
        const v = q.data[k];
        if (v && typeof v === 'object' && v.img) {
          if (v.img.indexOf('data:image/') !== 0 || v.img.length > 6000000) throw new Error('Foto tidak valid atau terlalu besar.');
          const blob = Utilities.newBlob(Utilities.base64Decode(v.img.split(',')[1]), 'image/jpeg',
            Utilities.getUuid().slice(0, 6) + '_' + String(v.name).replace(/[^\w.\-]/g, '_'));
          q.data[k] = { file: photoFolder().createFile(blob).getId(), name: String(v.name) };
        }
      });
      const r = load('responses.json');
      r.push({ id: Utilities.getUuid(), formId: f.id, at: new Date().toISOString(), data: q.data });
      save('responses.json', r);
      return out({ ok: true });
    }

    admin(); // semua aksi di bawah ini khusus admin
    if (a === 'listForms') {
      const r = load('responses.json');
      return out({ ok: true, forms: load('forms.json').map(f => Object.assign(f, { count: r.filter(x => x.formId === f.id).length })) });
    }
    if (a === 'saveForm') {
      const fs = load('forms.json'), f = q.form;
      if (!f.id) { f.id = Utilities.getUuid().slice(0, 8); fs.push(f); }
      else { const i = fs.findIndex(x => x.id === f.id); if (i < 0) throw new Error('Formulir tidak ada.'); fs[i] = f; }
      save('forms.json', fs);
      return out({ ok: true, id: f.id });
    }
    if (a === 'deleteForm') {
      trashPhotos(load('responses.json').filter(x => x.formId === q.id));
      save('forms.json', load('forms.json').filter(x => x.id !== q.id));
      save('responses.json', load('responses.json').filter(x => x.formId !== q.id));
      return out({ ok: true });
    }
    if (a === 'listResponses') {
      return out({ ok: true, responses: load('responses.json').filter(x => x.formId === q.id).reverse() });
    }
    if (a === 'deleteResponse') {
      trashPhotos(load('responses.json').filter(x => x.id === q.id));
      save('responses.json', load('responses.json').filter(x => x.id !== q.id));
      return out({ ok: true });
    }
    if (a === 'getFile') {
      const f = DriveApp.getFileById(q.fid), p = f.getParents();
      if (!p.hasNext() || p.next().getId() !== photoFolder().getId()) throw new Error('File tidak diizinkan.');
      return out({ ok: true, img: 'data:image/jpeg;base64,' + Utilities.base64Encode(f.getBlob().getBytes()) });
    }
    throw new Error('Aksi tidak dikenal.');
  } catch (err) {
    return out({ ok: false, error: err.message });
  } finally {
    lock.releaseLock();
  }
}

</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tok=()=>sessionStorage.getItem('t');
async function api(action,d={}){try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:tok(),...d})});const j=await r.json();
 if(!j.ok&&/Sesi berakhir/.test(j.error||'')){sessionStorage.removeItem('t');location.hash='admin';route();}return j}catch(e){return{ok:false,error:'Gagal terhubung ke server.'}}}
const TYPES={text:'Teks singkat',textarea:'Paragraf',number:'Angka',date:'Tanggal',tel:'No. telepon',email:'Email',select:'Pilihan (dropdown)',radio:'Pilihan tunggal',checkbox:'Pilihan ganda',file:'Unggah foto (KTP/identitas)'};
let forms=[],edit=null;

function route(){if(API.startsWith('GANTI')||location.hash==='#setup')return setup();const id=new URLSearchParams(location.search).get('f');
 if(id)return publicForm(id); if(location.hash==='#admin')return tok()?dash():login(); app.innerHTML='<div class="card"><h2>Selamat datang</h2><p class="mut">Silakan buka tautan formulir yang diberikan oleh Rizal Hypno Center.</p></div>';}
addEventListener('hashchange',route);


function setup(){app.innerHTML=`<div class="card"><h2>Panduan Pemasangan</h2><p class="mut">Halaman ini muncul otomatis selama alamat server belum diisi.</p>
<ol style="line-height:1.8;padding-left:20px"><li>Buka <b>script.google.com</b> → <b>Proyek baru</b>, hapus isi bawaan, lalu tempel kode di bawah (tombol Salin).</li>
<li>Ganti <code>ADMIN_PASS</code> pada kode dengan password Anda.</li>
<li>Klik <b>Deploy → New deployment → Web app</b>. Execute as: <b>Me</b>, Who has access: <b>Anyone</b>. Setujui izin Drive, lalu salin URL-nya.</li>
<li>Di GitHub, edit file ini (ikon pensil), lihat <b>baris ke-2</b> (paling atas), ganti tulisan <code>GANTI_DENGAN_URL_WEB_APP_ANDA</code> dengan URL tadi, lalu <b>Commit</b>.</li>
<li>Tunggu ±1 menit, lalu buka <code>${esc(location.origin+location.pathname)}#admin</code> untuk login.</li></ol>
<textarea id="gsc" rows="12" readonly style="font-family:monospace;font-size:12px"></textarea>
<div class="row" style="margin-top:10px"><button id="cp">Salin Kode Server</button></div></div>`;
 $('#gsc').value=document.getElementById('gs').textContent.trim();
 $('#cp').onclick=()=>{navigator.clipboard.writeText($('#gsc').value);$('#cp').textContent='Tersalin ✓'}}
/* ---------- PUBLIK ---------- */
async function publicForm(id){app.innerHTML='<div class="card mut">Memuat formulir…</div>';
 const r=await api('getForm',{id});if(!r.ok)return app.innerHTML=`<div class="card err">${esc(r.error)}</div>`;const f=r.form;
 app.innerHTML=`<div class="card"><span class="badge">${f.type==='terapi'?'Formulir Terapi':'Formulir Pelatihan'}</span><h2 style="margin-top:8px">${esc(f.title)}</h2><p class="mut">${esc(f.desc)}</p>
 <div id="ff">${f.fields.map((x,i)=>fieldHTML(x,i)).join('')}</div><div id="msg" class="err"></div><button id="send" style="margin-top:14px">Kirim Formulir</button></div>`;
 document.querySelectorAll('input[type=file]').forEach(e=>e.onchange=()=>{if(e.files[0]&&e.files[0].size>3145728){$('#msg').textContent='Ukuran foto terlalu besar. Maksimal 3 MB.';e.value=''}else $('#msg').textContent=''});
 $('#send').onclick=async()=>{const data={};
  for(const [i,x] of f.fields.entries()){let v;
   if(x.type==='checkbox')v=[...document.querySelectorAll(`[name=f${i}]:checked`)].map(e=>e.value).join(', ');
   else if(x.type==='radio')v=(document.querySelector(`[name=f${i}]:checked`)||{}).value||'';
   else if(x.type==='file'){const fl=$(`[name=f${i}]`).files[0];if(fl&&fl.size>3145728)return $('#msg').textContent='Ukuran foto maksimal 3 MB: '+x.label;v=fl?await shrink(fl):''}
   else v=$(`[name=f${i}]`).value.trim();
   if(x.req&&!v)return $('#msg').textContent='Mohon isi: '+x.label;data[x.label]=v;}
  $('#send').disabled=true;$('#send').textContent='Mengirim…';$('#msg').textContent='';const r=await api('submit',{id,data});
  if(r.ok)app.innerHTML='<div class="card" style="text-align:center"><h2>Terima kasih</h2><p class="ok">Formulir Anda berhasil dikirim.</p></div>';
  else{$('#msg').textContent=r.error;$('#send').disabled=false;$('#send').textContent='Kirim Formulir'}};}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({name:f.name,img:c.toDataURL('image/jpeg',.82)})};im.onerror=()=>res('');im.src=u})}
function fieldHTML(x,i){const o=(x.options||'').split('\n').map(s=>s.trim()).filter(Boolean);let h;
 if(x.type==='textarea')h=`<textarea name="f${i}" rows="4"></textarea>`;
 else if(x.type==='select')h=`<select name="f${i}"><option value="">— Pilih —</option>${o.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`;
 else if(x.type==='radio'||x.type==='checkbox')h=o.map(v=>`<label class="opt"><input type="${x.type}" name="f${i}" value="${esc(v)}">${esc(v)}</label>`).join('');
 else if(x.type==='file')h=`<input type="file" accept="image/*" name="f${i}"><div class="mut" style="margin-top:4px">Format JPG/PNG, maksimal 3 MB. Foto disimpan aman di Google Drive pemilik formulir.</div>`;
 else h=`<input type="${x.type}" name="f${i}">`;
 return `<label>${esc(x.label)}${x.req?' <i>*</i>':''}</label>${h}`}

/* ---------- ADMIN ---------- */
function login(){app.innerHTML=`<div class="card" style="max-width:380px;margin:auto"><h2>Login Admin</h2><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div id="msg" class="err"></div><button id="go" style="width:100%;margin-top:8px">Masuk</button></div>`;
 const go=async()=>{$('#go').disabled=true;const r=await api('login',{user:$('#u').value,pass:$('#p').value});
  if(r.ok){sessionStorage.setItem('t',r.token);dash()}else{$('#msg').textContent=r.error;$('#go').disabled=false}};
 $('#go').onclick=go;$('#p').onkeydown=e=>e.key==='Enter'&&go();}
async function logout(){await api('logout');sessionStorage.removeItem('t');login()}
async function dash(){app.innerHTML='<div class="card mut">Memuat…</div>';const r=await api('listForms');if(!r.ok)return;forms=r.forms;
 const base=location.origin+location.pathname;
 app.innerHTML=`<div class="row sp" style="margin-bottom:12px"><h2 style="margin:0">Dashboard Admin</h2><div class="row"><button class="gold" id="new">+ Formulir Baru</button><button class="g" id="lo">Logout</button></div></div>
 ${forms.map(f=>`<div class="card"><div class="row sp"><div><span class="badge">${f.type}</span> ${f.active===false?'<span class="badge">ditutup</span>':''}<h2 style="margin-top:6px;font-size:22px">${esc(f.title)}</h2><div class="mut">${f.count} respon · <a href="${base}?f=${f.id}" target="_blank">${base}?f=${f.id}</a></div></div>
 <div class="row"><button data-a="resp" data-id="${f.id}">Lihat Data</button><button class="g" data-a="edit" data-id="${f.id}">Edit</button><button class="g" data-a="copy" data-id="${f.id}">Salin Tautan</button><button class="d" data-a="del" data-id="${f.id}">Hapus</button></div></div></div>`).join('')||'<div class="card mut">Belum ada formulir. Klik “Formulir Baru”.</div>'}`;
 $('#lo').onclick=logout;$('#new').onclick=()=>builder({title:'',type:'terapi',desc:'',active:true,fields:[{label:'Nama Lengkap',type:'text',req:true},{label:'No. WhatsApp',type:'tel',req:true},{label:'Email',type:'email',req:false}]});
 app.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const f=forms.find(x=>x.id===b.dataset.id);
  if(b.dataset.a==='resp')responses(f);else if(b.dataset.a==='edit')builder(JSON.parse(JSON.stringify(f)));
  else if(b.dataset.a==='copy'){navigator.clipboard.writeText(`${base}?f=${f.id}`);b.textContent='Tersalin ✓'}
  else if(confirm('Hapus formulir beserta seluruh datanya?')){await api('deleteForm',{id:f.id});dash()}});}
function builder(f){edit=f;const draw=()=>{
 app.innerHTML=`<div class="card"><h2>${f.id?'Edit':'Buat'} Formulir</h2><label>Judul</label><input id="t" value="${esc(f.title)}"><label>Jenis</label><select id="ty"><option value="terapi">Terapi</option><option value="pelatihan">Pelatihan</option></select>
 <label>Deskripsi / petunjuk</label><textarea id="ds" rows="3">${esc(f.desc)}</textarea><label class="opt"><input type="checkbox" id="ac" ${f.active!==false?'checked':''}> Formulir aktif (menerima pengisian)</label></div>
 <div class="card"><h2 style="font-size:21px">Pertanyaan</h2>${f.fields.map((x,i)=>`<div class="fld"><div class="row"><input data-k="label" data-i="${i}" value="${esc(x.label)}" placeholder="Pertanyaan"><select data-k="type" data-i="${i}">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${x.type===k?'selected':''}>${v}</option>`).join('')}</select>
 <label class="opt" style="margin:0"><input type="checkbox" data-k="req" data-i="${i}" ${x.req?'checked':''}>Wajib</label><button class="g" data-m="up" data-i="${i}">↑</button><button class="g" data-m="dn" data-i="${i}">↓</button><button class="d" data-m="rm" data-i="${i}">✕</button></div>
 ${['select','radio','checkbox'].includes(x.type)?`<textarea data-k="options" data-i="${i}" rows="3" placeholder="Satu pilihan per baris" style="margin-top:8px">${esc(x.options||'')}</textarea>`:''}</div>`).join('')}
 <button class="g" id="af">+ Tambah Pertanyaan</button></div><div id="msg" class="err"></div><div class="row"><button id="sv">Simpan</button><button class="g" id="cx">Batal</button></div>`;
 $('#ty').value=f.type;
 const sync=()=>{f.title=$('#t').value;f.type=$('#ty').value;f.desc=$('#ds').value;f.active=$('#ac').checked};
 app.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{sync();const x=f.fields[e.dataset.i],k=e.dataset.k;x[k]=k==='req'?e.checked:e.value;if(k==='type')draw()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.i,m=b.dataset.m,a=f.fields;
  if(m==='rm')a.splice(i,1);else{const j=m==='up'?i-1:i+1;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]]}draw()});
 $('#af').onclick=()=>{sync();f.fields.push({label:'',type:'text',req:false});draw()};$('#cx').onclick=dash;
 $('#sv').onclick=async()=>{sync();if(!f.title.trim()||f.fields.some(x=>!x.label.trim()))return $('#msg').textContent='Judul dan semua pertanyaan harus diisi.';
  const r=await api('saveForm',{form:f});r.ok?dash():$('#msg').textContent=r.error}};draw()}
const cell=v=>v&&v.file?`<button class="g" data-ph="${esc(v.file)}">Lihat foto</button>`:esc(v);
async function responses(f){app.innerHTML='<div class="card mut">Memuat data…</div>';const r=await api('listResponses',{id:f.id});if(!r.ok)return;const R=r.responses;
 app.innerHTML=`<div class="row sp" style="margin-bottom:12px"><h2 style="margin:0">${esc(f.title)}</h2><div class="row"><button class="gold" id="csv">Unduh CSV</button><button class="g" id="bk">← Kembali</button></div></div>
 <div class="card tw"><table><tr><th>Waktu</th>${f.fields.map(x=>`<th>${esc(x.label)}</th>`).join('')}<th></th></tr>
 ${R.map(x=>`<tr><td>${new Date(x.at).toLocaleString('id-ID')}</td>${f.fields.map(y=>`<td>${cell(x.data[y.label])}</td>`).join('')}<td><button class="d" data-id="${x.id}">Hapus</button></td></tr>`).join('')||`<tr><td colspan="${f.fields.length+2}" class="mut">Belum ada respon.</td></tr>`}</table></div>`;
 $('#bk').onclick=dash;
 app.querySelectorAll('[data-ph]').forEach(b=>b.onclick=async()=>{b.textContent='Memuat…';const r=await api('getFile',{fid:b.dataset.ph});b.textContent='Lihat foto';if(!r.ok)return alert(r.error);const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9';o.innerHTML='<img style="max-width:100%;max-height:100%;border-radius:6px">';o.firstChild.src=r.img;o.onclick=()=>o.remove();document.body.appendChild(o)});
 $('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Waktu',...f.fields.map(x=>x.label)],...R.map(x=>[x.at,...f.fields.map(y=>{const v=x.data[y.label];return v&&v.name?v.name+' (foto di Drive)':v})])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=f.title+'.csv';a.click()};
 app.querySelectorAll('td button.d').forEach(b=>b.onclick=async()=>{if(confirm('Hapus respon ini?')){await api('deleteResponse',{id:b.dataset.id});responses(f)}})}
route();
</script></body></html>
